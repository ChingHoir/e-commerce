services:
  app:
    build: .
    container_name: app
    working_dir: /var/www
    volumes:
      - .:/var/www
    networks:
      - laravel
  db:
    image: mysql:8.0
    container_name: mysql_db
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: mysql_test
      MYSQL_USER: laravel
      MYSQL_PASSWORD: laravel
    networks:
      - laravel
networks:
  laravel:
    driver: bridge